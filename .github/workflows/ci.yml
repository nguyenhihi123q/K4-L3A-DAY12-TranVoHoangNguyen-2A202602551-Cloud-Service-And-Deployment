name: CI

# Chạy khi push và khi mở pull request — bắt lỗi TRƯỚC khi merge.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ── 1. Chạy test ────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      # Secret giả chỉ để app khởi động trong CI; KHÔNG phải khóa thật.
      AGENT_API_KEY: ci-dummy
      REDIS_URL: fake://
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cài dependency
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Chạy pytest (bỏ test cần deploy sống + bonus)
        # test_cp5.py gọi vào service đã deploy, test_bonus_cicd.py cần badge live
        # → loại ra khỏi CI, nếu không sẽ luôn đỏ.
        run: |
          pytest -m "not docker" \
            --ignore=tests/test_cp5.py \
            --ignore=tests/test_bonus_cicd.py

  # ── 2. Build thử Docker image ───────────────────────────────
  build:
    name: Build image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        # Dockerfile hỏng mà chỉ phát hiện lúc deploy là quá muộn.
        run: docker build -t day12-agent:ci .

  # ── 3. Deploy — chỉ khi test + build đã xanh, và chỉ từ main ─
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Trigger deploy
        # Token deploy lấy từ GitHub Secrets, KHÔNG hardcode trong file này.
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "Triggering deploy bằng token từ secrets..."
          # Ví dụ: railway up --service day12-agent
      - name: Smoke test sau deploy
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
        run: |
          curl -fsS "$DEPLOY_URL/health"
